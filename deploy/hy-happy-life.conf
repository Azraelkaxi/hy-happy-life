server {
    listen 80;
    listen [::]:80;
    server_name hy.azraelkaxi.top www.hy.azraelkaxi.top;

    access_log /www/apps/hy-happy-life/logs/nginx-access.log;
    error_log /www/apps/hy-happy-life/logs/nginx-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/apps/hy-happy-life/data/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://hy.azraelkaxi.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hy.azraelkaxi.top www.hy.azraelkaxi.top;

    root /www/apps/hy-happy-life/app;
    index index.html;

    ssl_certificate /www/apps/hy-happy-life/data/ssl/fullchain.pem;
    ssl_certificate_key /www/apps/hy-happy-life/data/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/apps/hy-happy-life/logs/nginx-access.log;
    error_log /www/apps/hy-happy-life/logs/nginx-error.log;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
